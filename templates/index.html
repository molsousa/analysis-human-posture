<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Análise de Postura - Streaming</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Análise de Postura em Tempo Real</h1>
      </div>

      <div class="video-container">
        <img id="videoStream" src="" alt="Streaming de análise" class="video-frame" />
      </div>

      <div class="info-panels">
        <!-- Painel de Feedback de Repetição -->
        <div class="panel">
          <h2 class="panel-title"><i class="fas fa-info-circle"></i> Informações do Sistema</h2>
          <div class="connection-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="connectionText">Conectando ao servidor de análise...</span>
          </div>

          <div class="system-info">
            <p>
              <i class="fas fa-laptop"></i> Execute no notebook:
            </p>
            <code>python main.py --exercise exercise_templates/pushup.json --video 0</code>
            <p>
              <i class="fas fa-globe"></i> Acesse pelo celular:
            </p>
            <div class="server-url" id="serverAddress">http://localhost:5000</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <p>Sistema de Análise de Postura</p>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
